<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candyman Booth — Photo to 3D</title>
<style>
  body { margin: 0; overflow: hidden; background: #0a0a14; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 300px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Candyman Booth</b> — direct from photo<br>
  Photo textures · Real 3D volume<br>
  Drag to orbit · Scroll to zoom
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a12);
scene.fog = new THREE.Fog(0x0a0a12, 30, 75);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(1.5, 3.2, 11);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.8, 0);
controls.update();

// Natural night lighting — photo already has baked lighting
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const fill = new THREE.DirectionalLight(0xfff0dd, 0.4);
fill.position.set(3, 6, 8);
scene.add(fill);

{
  const g = new THREE.CircleGeometry(26, 48);
  const ground = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x141416, roughness: 1 }));
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
}

const loader = new THREE.TextureLoader();
function photoTex(path) {
  const t = loader.load(path);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const booth = new THREE.Group();
const BW = 7.2, BD = 4.0;

// === MAIN FACADE — photo-textured front wall ===
// Using the actual photo crops as textures on 3D geometry

// CANDYMAN sign — arched 3D board with photo texture
{
  const tex = photoTex('candyman-crops/sign.jpg');
  const shape = new THREE.Shape();
  // Match the photo's arched sign shape
  shape.moveTo(-3.55, 0);
  shape.lineTo(-3.55, 0.85);
  shape.quadraticCurveTo(-3.5, 1.65, -2.2, 1.85);
  shape.quadraticCurveTo(0, 2.1, 2.2, 1.85);
  shape.quadraticCurveTo(3.5, 1.65, 3.55, 0.85);
  shape.lineTo(3.55, 0);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05, bevelSegments: 2, curveSegments: 24 });
  // Map photo texture to front face
  const uv = geo.attributes.uv, pa = geo.attributes.position;
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9;
  for (let i=0;i<pa.count;i++){minX=Math.min(minX,pa.getX(i));maxX=Math.max(maxX,pa.getX(i));minY=Math.min(minY,pa.getY(i));maxY=Math.max(maxY,pa.getY(i));}
  for (let i=0;i<uv.count;i++)uv.setXY(i,(pa.getX(i)-minX)/(maxX-minX),(pa.getY(i)-minY)/(maxY-minY));
  const sign = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.5 }));
  sign.position.set(-0.2, 4.35, 1.85);
  sign.castShadow = true;
  booth.add(sign);
}

// Banner — photo texture on 3D board
{
  const tex = photoTex('candyman-crops/banner.jpg');
  const geo = new THREE.BoxGeometry(7.4, 0.85, 0.12, 1, 1, 1);
  const banner = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7 }));
  banner.position.set(-0.2, 3.75, 1.95);
  banner.castShadow = true;
  booth.add(banner);
}

// Awning — photo texture, with real 3D slope and scallops
{
  const tex = photoTex('candyman-crops/awning.jpg');
  tex.wrapS = THREE.RepeatWrapping;
  const geo = new THREE.PlaneGeometry(7.6, 1.35, 40, 10);
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const px = pos.getX(i), py = pos.getY(i);
    const vT = (py + 0.675) / 1.35;
    // Slope outward
    pos.setZ(i, (1-vT) * 0.75);
    // Scalloped bottom edge (from photo)
    if (vT < 0.18) {
      pos.setY(i, py - Math.abs(Math.sin(px * 4.2)) * 0.16 * (0.18-vT)/0.18);
    }
    // Fabric ripple
    pos.setZ(i, pos.getZ(i) + Math.sin(px*6 + vT*5)*0.03);
  }
  geo.computeVertexNormals();
  // Fix UVs after deformation
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i), uv.getY(i));
  const awning = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, side: THREE.DoubleSide }));
  awning.position.set(-0.2, 3.05, 2.1);
  awning.rotation.x = 0.25;
  awning.castShadow = true;
  booth.add(awning);
}

// === BOOTH STRUCTURE with photo-textured walls ===
// Side walls — dark wood (from photo's side areas)
{
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0e, roughness: 0.9 });
  const backGeo = new THREE.BoxGeometry(BW, 3.2, 0.15);
  const back = new THREE.Mesh(backGeo, wallMat);
  back.position.set(0, 1.7, -BD/2);
  booth.add(back);
  
  for (const sx of [-1, 1]) {
    const sideGeo = new THREE.BoxGeometry(0.15, 3.2, BD);
    const side = new THREE.Mesh(sideGeo, wallMat);
    side.position.set(sx * BW/2, 1.7, 0);
    side.castShadow = true;
    booth.add(side);
  }
}

// Floor
{
  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(BW, 0.1, BD),
    new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.9 })
  );
  floor.position.y = 0.05;
  floor.receiveShadow = true;
  booth.add(floor);
}

// Corner posts
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const post = new THREE.Mesh(
    new THREE.CylinderGeometry(0.09, 0.11, 4.4, 10),
    new THREE.MeshStandardMaterial({ color: 0x4a3020, roughness: 0.85 })
  );
  post.position.set(sx * BW/2, 2.2, sz * BD/2);
  post.castShadow = true;
  booth.add(post);
}

// === COUNTER — photo-textured front ===
{
  const tex = photoTex('candyman-crops/counter_front.jpg');
  const geo = new THREE.BoxGeometry(7.0, 1.35, 0.6, 1, 1, 1);
  const counter = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.7 }));
  counter.position.set(-0.2, 0.72, BD/2 - 0.4);
  counter.castShadow = true;
  counter.receiveShadow = true;
  booth.add(counter);
  
  // Counter top — dark wood
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(7.2, 0.08, 0.9),
    new THREE.MeshStandardMaterial({ color: 0x2a1a0c, roughness: 0.4 })
  );
  top.position.set(-0.2, 1.43, BD/2 - 0.4);
  top.castShadow = true;
  top.receiveShadow = true;
  booth.add(top);
}

// === LEFT JARS DISPLAY — photo-textured 3D boxes ===
// The dense candy display on the left, using the actual photo
{
  const tex = photoTex('candyman-crops/left_jars.jpg');
  // Main display block — left side, packed with jars
  const geo = new THREE.BoxGeometry(2.6, 2.8, 1.4, 4, 4, 2);
  // Slightly irregular to avoid perfect box look
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i,
      pos.getX(i) + (Math.random()-0.5)*0.04,
      pos.getY(i) + (Math.random()-0.5)*0.04,
      pos.getZ(i) + (Math.random()-0.5)*0.04
    );
  }
  geo.computeVertexNormals();
  const display = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.6 }));
  display.position.set(-2.4, 2.75, BD/2 - 0.3);
  display.castShadow = true;
  booth.add(display);
  
  // Second block — middle-left, interior jars
  const tex2 = photoTex('candyman-crops/interior_left.jpg');
  const geo2 = new THREE.BoxGeometry(2.0, 2.2, 1.0, 3, 3, 2);
  const pos2 = geo2.attributes.position;
  for (let i = 0; i < pos2.count; i++) {
    pos2.setXYZ(i,
      pos2.getX(i) + (Math.random()-0.5)*0.04,
      pos2.getY(i) + (Math.random()-0.5)*0.04,
      pos2.getZ(i) + (Math.random()-0.5)*0.04
    );
  }
  geo2.computeVertexNormals();
  const display2 = new THREE.Mesh(geo2, new THREE.MeshStandardMaterial({ map: tex2, roughness: 0.6 }));
  display2.position.set(-0.3, 2.5, BD/2 - 0.6);
  display2.castShadow = true;
  booth.add(display2);
}

// === ROOF — striped tent with photo-like texture ===
{
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  // Sample colors from the photo's awning
  for (let s = 0; s < 14; s++) {
    ctx.fillStyle = s % 2 ? '#d8c8b8' : '#903038';
    ctx.fillRect(s * (512/14), 0, 512/14 + 1, 256);
  }
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  const roofMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9, side: THREE.DoubleSide });
  
  const roofW = BW + 1.0, roofD = BD + 1.0, peakH = 1.4;
  for (const sz of [-1, 1]) {
    const geo = new THREE.PlaneGeometry(roofW, Math.sqrt((roofD/2)**2 + peakH**2), 20, 8);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) {
      p.setZ(i, Math.sin(p.getX(i)*2)*0.04);
    }
    geo.computeVertexNormals();
    const slope = new THREE.Mesh(geo, roofMat);
    const ang = Math.atan2(peakH, roofD/2);
    slope.rotation.x = sz > 0 ? -(Math.PI/2 - ang) : (Math.PI/2 - ang);
    slope.position.set(0, 4.6 + peakH/2, sz * roofD/4);
    slope.castShadow = true;
    booth.add(slope);
  }
}

// Warm interior lights (from photo's glow)
for (let i = 0; i < 5; i++) {
  const gl = new THREE.PointLight(0xffa050, 12, 8);
  gl.position.set(-2.5 + i*1.25, 3.2, 1.0);
  booth.add(gl);
}

scene.add(booth);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
