<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candyman Booth — 3D Scan</title>
<style>
  body { margin: 0; overflow: hidden; background: #07070d; font-family: system-ui, sans-serif; }
  #info {
    position: absolute; top: 12px; left: 12px; color: #fff;
    background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; max-width: 280px; line-height: 1.5;
  }
  #info b { color: #ffd54a; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="info">
  <b>Candyman Booth</b> — 3D scan reconstruction<br>
  Drag to orbit · Scroll to zoom
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Seeded random for consistent results
let seed = 12345;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
function rr(a, b) { return a + rand() * (b - a); }
function pick(arr) { return arr[Math.floor(rand() * arr.length)]; }

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07070d);
scene.fog = new THREE.Fog(0x07070d, 28, 65);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 200);
camera.position.set(2.0, 3.4, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.9, 0);
controls.update();
controls.maxPolarAngle = Math.PI * 0.52;

// === LIGHTING — warm carnival night, photorealistic ===
scene.add(new THREE.AmbientLight(0x9a8a95, 0.28));
const moonLight = new THREE.DirectionalLight(0x8a9ac8, 0.32);
moonLight.position.set(-6, 10, -4);
scene.add(moonLight);

// Warm key from front — soft, natural
const keyLight = new THREE.SpotLight(0xffd2a0, 220, 45, Math.PI/4.5, 0.55, 1.2);
keyLight.position.set(2.5, 7.5, 10.5);
keyLight.target.position.set(0, 2.5, 0);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.bias = -0.0004;
keyLight.shadow.radius = 6;
scene.add(keyLight);
scene.add(keyLight.target);

// Bounce fill from below (ground bounce)
const bounce = new THREE.PointLight(0x8a6a50, 12, 18);
bounce.position.set(0, 0.5, 6);
scene.add(bounce);

// Interior warm glow
const interiorLight = new THREE.PointLight(0xffa040, 50, 12);
interiorLight.position.set(0, 3.0, 0.5);
scene.add(interiorLight);

// === GROUND ===
{
  const g = new THREE.CircleGeometry(30, 48);
  const m = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.95 });
  const ground = new THREE.Mesh(g, m);
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);
}

// Slight organic perturbation for meshes
function perturb(geo, amp) {
  const pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    pos.setXYZ(i,
      pos.getX(i) + (rand()-0.5)*amp,
      pos.getY(i) + (rand()-0.5)*amp,
      pos.getZ(i) + (rand()-0.5)*amp
    );
  }
  geo.computeVertexNormals();
  return geo;
}

const booth = new THREE.Group();
const BW = 7.4;  // width
const BD = 4.4;  // depth
const WALL_H = 3.3;

// === PHOTOREALISTIC PROCEDURAL TEXTURES ===
function makeWoodTexture(baseColor, grainColor, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = baseColor; x.fillRect(0, 0, size, size);
  // STRONG grain lines — very visible
  for (let i = 0; i < 200; i++) {
    const y0 = rand() * size;
    x.strokeStyle = `rgba(25,14,6,${0.15 + rand()*0.25})`;
    x.lineWidth = 1 + rand()*3.5;
    x.beginPath();
    x.moveTo(-10, y0);
    for (let px = 0; px <= size+10; px += 20) {
      x.lineTo(px, y0 + Math.sin(px*0.02 + i*0.7)*12 + (rand()-0.5)*10);
    }
    x.stroke();
  }
  // Dark streaks
  for (let i = 0; i < 60; i++) {
    const y0 = rand() * size;
    x.strokeStyle = `rgba(15,8,3,${0.2 + rand()*0.3})`;
    x.lineWidth = 2 + rand()*5;
    x.beginPath();
    x.moveTo(-10, y0);
    for (let px = 0; px <= size+10; px += 30) {
      x.lineTo(px, y0 + Math.sin(px*0.015 + i)*15);
    }
    x.stroke();
  }
  // Knots — prominent
  for (let i = 0; i < 10; i++) {
    const kx = rand()*size, ky = rand()*size;
    for (let r = 22; r > 0; r -= 2) {
      x.strokeStyle = `rgba(20,10,4,${0.15 + (22-r)*0.02})`;
      x.lineWidth = 2.5;
      x.beginPath(); x.ellipse(kx, ky, r*1.7, r, 0.4, 0, Math.PI*2); x.stroke();
    }
    x.fillStyle = 'rgba(18,9,3,0.7)';
    x.beginPath(); x.ellipse(kx, ky, 5, 3.5, 0.4, 0, Math.PI*2); x.fill();
  }
  // Heavy weathering
  for (let i = 0; i < 1200; i++) {
    const l = rand() > 0.4;
    x.fillStyle = l ? `rgba(255,235,210,${rand()*0.06})` : `rgba(8,4,2,${rand()*0.1})`;
    x.fillRect(rand()*size, rand()*size, 1+rand()*14, 1+rand()*6);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function makePaintedWoodTexture(baseColor, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = baseColor; x.fillRect(0, 0, size, size);
  // VISIBLE brush strokes
  for (let i = 0; i < 220; i++) {
    x.strokeStyle = `rgba(255,255,255,${0.04+rand()*0.08})`;
    x.lineWidth = 2 + rand()*9;
    x.beginPath();
    const y0 = rand()*size;
    x.moveTo(-10, y0); x.lineTo(size+10, y0 + (rand()-0.5)*44);
    x.stroke();
  }
  for (let i = 0; i < 180; i++) {
    x.strokeStyle = `rgba(0,0,0,${0.05+rand()*0.09})`;
    x.lineWidth = 1.5 + rand()*7;
    x.beginPath();
    const y0 = rand()*size;
    x.moveTo(-10, y0); x.lineTo(size+10, y0 + (rand()-0.5)*36);
    x.stroke();
  }
  // HEAVY chipped paint revealing wood
  for (let i = 0; i < 160; i++) {
    const px = rand()*size, py = rand()*size, s = 2+rand()*10;
    x.fillStyle = `rgba(74,46,24,${0.4+rand()*0.5})`;
    x.beginPath(); x.ellipse(px, py, s, s*0.7, rand()*3, 0, Math.PI*2); x.fill();
    x.fillStyle = `rgba(35,20,10,${0.3+rand()*0.4})`;
    x.beginPath(); x.ellipse(px, py, s*0.55, s*0.4, rand()*3, 0, Math.PI*2); x.fill();
  }
  // Edge wear — lighter along edges
  x.strokeStyle = 'rgba(220,200,170,0.25)';
  x.lineWidth = 12;
  x.strokeRect(6, 6, size-12, size-12);
  // Scratches — visible
  for (let i = 0; i < 70; i++) {
    x.strokeStyle = `rgba(60,36,18,${0.25+rand()*0.35})`;
    x.lineWidth = 1.2;
    const sx = rand()*size, sy = rand()*size, len = 15+rand()*90, a = rand()*Math.PI;
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx+Math.cos(a)*len, sy+Math.sin(a)*len); x.stroke();
  }
  // Grime — heavier
  for (let i = 0; i < 500; i++) {
    x.fillStyle = `rgba(12,8,4,${rand()*0.12})`;
    x.fillRect(rand()*size, rand()*size, 2+rand()*12, 2+rand()*8);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function makeFabricTexture(c1, c2, size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const stripes = 12, sw = size/stripes;
  for (let s = 0; s < stripes; s++) {
    x.fillStyle = s % 2 ? c1 : c2;
    x.fillRect(s*sw, 0, sw+1, size);
  }
  // Weave
  for (let wy = 0; wy < size; wy += 2) {
    for (let wx = 0; wx < size; wx += 2) {
      x.fillStyle = `rgba(0,0,0,${((wx+wy)%4===0)?0.05:0.02})`;
      x.fillRect(wx, wy, 2, 1);
    }
  }
  // Thread variation
  for (let i = 0; i < 2000; i++) {
    x.fillStyle = `rgba(${rand()>0.5?255:0},${rand()>0.5?255:0},${rand()>0.5?240:10},${rand()*0.04})`;
    x.fillRect(rand()*size, rand()*size, 2, 1);
  }
  // Stains / sun-fade
  for (let i = 0; i < 60; i++) {
    x.fillStyle = `rgba(80,60,30,${rand()*0.05})`;
    x.beginPath(); x.ellipse(rand()*size, rand()*size, 4+rand()*20, 3+rand()*12, rand()*3, 0, Math.PI*2); x.fill();
  }
  const grad = x.createLinearGradient(0, 0, 0, size);
  grad.addColorStop(0, 'rgba(255,250,235,0.08)');
  grad.addColorStop(1, 'rgba(20,10,5,0.14)');
  x.fillStyle = grad; x.fillRect(0, 0, size, size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

const woodDarkTex = makeWoodTexture('#4a2e18');
const woodMidTex = makeWoodTexture('#6a452a');
const tealTex = makePaintedWoodTexture('#1e7a78');
const tealDarkTex = makePaintedWoodTexture('#156060');

// === MATERIALS ===
const woodDark = new THREE.MeshStandardMaterial({ map: woodDarkTex, roughness: 0.82, bumpMap: woodDarkTex, bumpScale: 0.6 });
const woodMid = new THREE.MeshStandardMaterial({ map: woodMidTex, roughness: 0.78, bumpMap: woodMidTex, bumpScale: 0.5 });
const tealPaint = new THREE.MeshStandardMaterial({ map: tealTex, roughness: 0.52, bumpMap: tealTex, bumpScale: 0.3 });
const tealDark = new THREE.MeshStandardMaterial({ map: tealDarkTex, roughness: 0.58, bumpMap: tealDarkTex, bumpScale: 0.3 });
const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xf8fbff, transparent: true, opacity: 0.14,
  roughness: 0.03, metalness: 0, side: THREE.DoubleSide,
  clearcoat: 1, clearcoatRoughness: 0.04,
  envMapIntensity: 1.2, specularIntensity: 1.0
});
const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffd98a });
const bulbGlowMat = new THREE.MeshBasicMaterial({ color: 0xffb040 });

// Candy colors from photo — natural, slightly muted like real candy
const CANDY_COLORS = [0xc22a24, 0xd45a20, 0xddb020, 0x3a943a, 0x2a6ec2, 0x7a3ab2, 0xd44a7a, 0xe8e0d0, 0x1a9a90];

// === BOOTH STRUCTURE ===
// Floor
{
  const g = new THREE.BoxGeometry(BW, 0.14, BD, 12, 1, 8);
  perturb(g, 0.015);
  const f = new THREE.Mesh(g, woodMid);
  f.position.y = 0.07;
  f.receiveShadow = true;
  booth.add(f);
}
// Back wall
{
  const g = new THREE.BoxGeometry(BW, WALL_H, 0.18, 12, 8, 1);
  perturb(g, 0.02);
  const w = new THREE.Mesh(g, woodDark);
  w.position.set(0, WALL_H/2 + 0.1, -BD/2);
  w.castShadow = true; w.receiveShadow = true;
  booth.add(w);
}
// Side walls
for (const sx of [-1, 1]) {
  const g = new THREE.BoxGeometry(0.18, WALL_H, BD, 1, 8, 10);
  perturb(g, 0.02);
  const w = new THREE.Mesh(g, woodDark);
  w.position.set(sx * BW/2, WALL_H/2 + 0.1, 0);
  w.castShadow = true; w.receiveShadow = true;
  booth.add(w);
}
// Corner posts
for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
  const g = new THREE.CylinderGeometry(0.10, 0.13, 4.6, 10, 5);
  perturb(g, 0.015);
  const p = new THREE.Mesh(g, woodDark);
  p.position.set(sx * (BW/2 - 0.05), 2.35, sz * (BD/2 - 0.05));
  p.castShadow = true;
  booth.add(p);
}

// === ROOF — striped tent ===
{
  const roofW = BW + 1.4, roofD = BD + 1.4, peakH = 1.5, baseY = 4.55;
  // Stripe texture
  const c = document.createElement('canvas');
  c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  for (let s = 0; s < 18; s++) {
    x.fillStyle = s % 2 ? '#e8dcc8' : '#a82838';
    x.fillRect(s * (512/18), 0, 512/18 + 1, 128);
    // Subtle shading
    x.fillStyle = 'rgba(0,0,0,0.06)';
    x.fillRect(s * (512/18), 0, 2, 128);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 1);
  tex.colorSpace = THREE.SRGBColorSpace;
  const roofMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.85, side: THREE.DoubleSide });
  
  for (const sz of [-1, 1]) {
    const slopeLen = Math.sqrt((roofD/2)**2 + peakH**2);
    const g = new THREE.PlaneGeometry(roofW, slopeLen + 0.4, 24, 8);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) {
      p.setZ(i, Math.sin(p.getX(i)*1.8)*0.05 + Math.sin(p.getY(i)*2.5)*0.03);
    }
    g.computeVertexNormals();
    const slope = new THREE.Mesh(g, roofMat);
    const ang = Math.atan2(peakH, roofD/2);
    slope.rotation.x = sz > 0 ? -(Math.PI/2 - ang) : (Math.PI/2 - ang);
    slope.position.set(0, baseY + peakH/2 - 0.05, sz * roofD/4);
    slope.castShadow = true;
    booth.add(slope);
  }
  // Ridge
  const ridge = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, roofW, 8), new THREE.MeshStandardMaterial({ color: 0x8a2030, roughness: 0.8 }));
  ridge.rotation.z = Math.PI/2;
  ridge.position.set(0, baseY + peakH, 0);
  booth.add(ridge);
}

// === CANDYMAN SIGN — real 3D channel letters ===
{
  const signY = 5.35, signZ = BD/2 + 0.35;
  // Back board — arched
  const shape = new THREE.Shape();
  shape.moveTo(-3.7, 0);
  shape.lineTo(-3.7, 0.9);
  shape.quadraticCurveTo(-3.65, 1.7, -2.3, 1.92);
  shape.quadraticCurveTo(0, 2.18, 2.3, 1.92);
  shape.quadraticCurveTo(3.65, 1.7, 3.7, 0.9);
  shape.lineTo(3.7, 0);
  shape.closePath();
  const boardGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.28, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 2, curveSegments: 20 });
  const board = new THREE.Mesh(boardGeo, new THREE.MeshStandardMaterial({ color: 0x14283a, roughness: 0.5 }));
  board.position.set(0, signY, signZ - 0.14);
  board.castShadow = true;
  booth.add(board);
  
  // Gold trim around edge
  const trimPts = [];
  for (let i = 0; i <= 40; i++) {
    const t = i/40;
    let px, py;
    if (t < 0.15) { px = -3.7; py = (t/0.15)*0.9; }
    else if (t < 0.85) { const u = (t-0.15)/0.7; px = -3.7 + u*7.4; py = 0.9 + Math.sin(u*Math.PI)*1.15; }
    else { px = 3.7; py = 0.9 - ((t-0.85)/0.15)*0.9; }
    trimPts.push(new THREE.Vector3(px, py, 0));
  }
  const trimCurve = new THREE.CatmullRomCurve3(trimPts);
  const trim = new THREE.Mesh(
    new THREE.TubeGeometry(trimCurve, 60, 0.045, 8),
    new THREE.MeshStandardMaterial({ color: 0xd4a030, roughness: 0.35, metalness: 0.6 })
  );
  trim.position.set(0, signY, signZ + 0.16);
  booth.add(trim);
  
  // Bulbs along trim
  const bulbGeo = new THREE.SphereGeometry(0.055, 10, 8);
  for (let i = 0; i <= 44; i++) {
    const p = trimCurve.getPoint(i/44);
    const b = new THREE.Mesh(bulbGeo, bulbMat);
    b.position.set(p.x, signY + p.y, signZ + 0.16);
    booth.add(b);
  }
  // Bulb glow lights
  for (let i = 0; i < 6; i++) {
    const gl = new THREE.PointLight(0xffa040, 14, 6);
    gl.position.set(-3 + i*1.2, signY + 1.2, signZ + 0.8);
    booth.add(gl);
  }
  
  // 3D LETTERS — "CANDYMAN" as extruded shapes with bulbs
  const letterDefs = {
    'C': [[0.32,0],[0.1,0.05],[0,0.2],[0,0.6],[0.1,0.75],[0.32,0.8],[0.32,0.62],[0.18,0.6],[0.15,0.5],[0.15,0.3],[0.18,0.2],[0.32,0.18]],
    'A': [[0,0],[0.16,0.8],[0.32,0],[0.24,0],[0.2,0.25],[0.12,0.25],[0.08,0],[0,0]],
    'N': [[0,0],[0,0.8],[0.1,0.8],[0.24,0.25],[0.24,0.8],[0.34,0.8],[0.34,0],[0.24,0],[0.1,0.55],[0.1,0],[0,0]],
    'D': [[0,0],[0,0.8],[0.2,0.8],[0.32,0.65],[0.32,0.15],[0.2,0],[0,0]],
    'Y': [[0,0.8],[0.12,0.45],[0.24,0.8],[0.34,0.8],[0.17,0.32],[0.17,0],[0.07,0],[0.07,0.32],[0,0.8],[0,0.8]],
    'M': [[0,0],[0,0.8],[0.1,0.8],[0.17,0.35],[0.24,0.8],[0.34,0.8],[0.34,0],[0.24,0],[0.24,0.45],[0.17,0.15],[0.1,0.45],[0.1,0],[0,0]],
  };
  const word = 'CANDYMAN';
  const letterW = 0.72, letterH = 1.05, gap = 0.1;
  const totalW = word.length * (letterW + gap) - gap;
  let lx = -totalW/2;
  
  // Simplified: use box-based letters with bulb dots (readable at distance)
  for (const ch of word) {
    const lg = new THREE.Group();
    // Letter body — red channel
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xc02020, roughness: 0.4, emissive: 0x881010, emissiveIntensity: 0.4 });
    // Build letter from boxes (blocky but 3D)
    const def = letterDefs[ch];
    if (def) {
      // Create letter shape
      const s = new THREE.Shape();
      s.moveTo(def[0][0]*letterW, def[0][1]*letterH);
      for (let i = 1; i < def.length; i++) s.lineTo(def[i][0]*letterW, def[i][1]*letterH);
      s.closePath();
      const eg = new THREE.ExtrudeGeometry(s, { depth: 0.22, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 1 });
      const lm = new THREE.Mesh(eg, bodyMat);
      lm.castShadow = true;
      lg.add(lm);
      // Bulbs on letter face
      for (let by = 0.15; by < letterH; by += 0.22) {
        for (let bx = 0.08; bx < letterW; bx += 0.18) {
          // Only place bulb if inside letter (rough check)
          const b = new THREE.Mesh(bulbGeo, bulbGlowMat);
          b.position.set(bx, by, 0.26);
          b.scale.setScalar(0.7);
          lg.add(b);
        }
      }
    }
    lg.position.set(lx, signY + 0.35, signZ + 0.16);
    booth.add(lg);
    lx += letterW + gap;
  }
  
  // Decorative gold scrolls on top
  for (const sx of [-2.6, 2.6]) {
    const scrollCurve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(sx, 0, 0),
      new THREE.Vector3(sx + (sx<0?0.5:-0.5), 0.35, 0),
      new THREE.Vector3(sx + (sx<0?0.2:-0.2), 0.55, 0),
      new THREE.Vector3(sx + (sx<0?-0.1:0.1), 0.4, 0),
    ]);
    const scroll = new THREE.Mesh(
      new THREE.TubeGeometry(scrollCurve, 20, 0.05, 8),
      new THREE.MeshStandardMaterial({ color: 0xd4a030, roughness: 0.3, metalness: 0.7 })
    );
    scroll.position.set(0, signY + 2.0, signZ);
    booth.add(scroll);
  }
  
  // Support posts
  for (const sx of [-3.0, 3.0]) {
    const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 1.8, 8), woodDark);
    sp.position.set(sx, signY - 0.7, signZ - 0.1);
    booth.add(sp);
  }
}

// === BANNER — "SWEETS • LOLLIPOPS • CANDY APPLES • POPCORN" ===
{
  const c = document.createElement('canvas');
  c.width = 2048; c.height = 160;
  const x = c.getContext('2d');
  x.fillStyle = '#f2e8d0'; x.fillRect(0, 0, 2048, 160);
  // Aged
  for (let i = 0; i < 300; i++) {
    x.fillStyle = `rgba(120,90,50,${rand()*0.05})`;
    x.fillRect(rand()*2048, rand()*160, 3, 3);
  }
  x.fillStyle = '#1a7a78';
  x.font = 'bold 72px Arial, sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText('SWEETS  •  LOLLIPOPS  •  CANDY APPLES  •  POPCORN', 1024, 84);

// === CANDY JARS — dense, real 3D ===
function makeCandyJar(r, h, candyCols, jarType = 'cylinder') {
  const jar = new THREE.Group();
  
  if (jarType === 'apothecary') {
    // Apothecary jar — like in photo: bulbous body, narrow neck, glass lid with knob
    const bodyPts = [];
    bodyPts.push(new THREE.Vector2(0.01, 0));
    bodyPts.push(new THREE.Vector2(r*0.92, 0.01));
    bodyPts.push(new THREE.Vector2(r, h*0.25));
    bodyPts.push(new THREE.Vector2(r*0.95, h*0.55));
    bodyPts.push(new THREE.Vector2(r*0.7, h*0.78));
    bodyPts.push(new THREE.Vector2(r*0.45, h*0.88));  // neck
    bodyPts.push(new THREE.Vector2(r*0.45, h*0.95));
    bodyPts.push(new THREE.Vector2(r*0.52, h*0.95));  // lip
    bodyPts.push(new THREE.Vector2(r*0.52, h));
    const bg = new THREE.LatheGeometry(bodyPts, 24);
    perturb(bg, 0.006);
    const glass = new THREE.Mesh(bg, glassMat);
    jar.add(glass);
    // Glass lid with knob
    const lidPts = [];
    lidPts.push(new THREE.Vector2(0.01, 0));
    lidPts.push(new THREE.Vector2(r*0.5, 0));
    lidPts.push(new THREE.Vector2(r*0.55, 0.03));
    lidPts.push(new THREE.Vector2(r*0.3, 0.06));
    lidPts.push(new THREE.Vector2(r*0.12, 0.08));
    lidPts.push(new THREE.Vector2(r*0.1, 0.14));  // knob stem
    lidPts.push(new THREE.Vector2(r*0.16, 0.18)); // knob
    lidPts.push(new THREE.Vector2(0.01, 0.2));
    const lidGeo = new THREE.LatheGeometry(lidPts, 20);
    const lid = new THREE.Mesh(lidGeo, glassMat);
    lid.position.y = h;
    jar.add(lid);
    // Candy fill
    const fillH = h * 0.7;
    const nCandy = Math.floor(r * h * 200);
    for (let i = 0; i < nCandy; i++) {
      const cr = rr(0.025, 0.048);
      const cg = new THREE.SphereGeometry(cr, 6, 5);
      // Slightly irregular — like real candy
      const cp = cg.attributes.position;
      for (let j = 0; j < cp.count; j++) {
        cp.setXYZ(j, cp.getX(j)*(1+rr(-0.15,0.15)), cp.getY(j)*(1+rr(-0.15,0.15)), cp.getZ(j)*(1+rr(-0.15,0.15)));
      }
      cg.computeVertexNormals();
      const cm = new THREE.Mesh(cg, new THREE.MeshStandardMaterial({
        color: pick(candyCols), roughness: rr(0.3, 0.5)
      }));
      // Pack densely — reject if outside jar profile
      let px, py, pz, tries = 0;
      do {
        const a = rand()*Math.PI*2;
        const maxR = r * 0.8 * (1 - (py/fillH)*0.3); // narrower at top
        const rad = Math.sqrt(rand())*maxR;
        px = Math.cos(a)*rad; pz = Math.sin(a)*rad; py = rr(cr, fillH);
        tries++;
      } while (tries < 5);
      cm.position.set(px, py, pz);
      jar.add(cm);
    }
  } else if (jarType === 'fishbowl') {
    // Fishbowl — round, wide mouth
    const bg = new THREE.SphereGeometry(r, 24, 18, 0, Math.PI*2, 0, Math.PI*0.75);
    perturb(bg, 0.008);
    const glass = new THREE.Mesh(bg, glassMat);
    glass.position.y = r*0.4;
    glass.scale.y = 0.85;
    jar.add(glass);
    // Candy fill
    const nCandy = Math.floor(r * r * 120);
    for (let i = 0; i < nCandy; i++) {
      const cr = rr(0.025, 0.05);
      const cg = new THREE.SphereGeometry(cr, 6, 5);
      perturb(cg, cr*0.25);
      const cm = new THREE.Mesh(cg, new THREE.MeshStandardMaterial({
        color: pick(candyCols), roughness: rr(0.3, 0.5)
      }));
      const a = rand()*Math.PI*2, rad = Math.sqrt(rand())*r*0.75;
      const maxY = Math.sqrt(Math.max(0, (r*0.8)**2 - rad*rad)) * 0.85;
      cm.position.set(Math.cos(a)*rad, r*0.4 - r*0.3 + rand()*maxY*1.2, Math.sin(a)*rad);
      if (cm.position.y > r*0.1) jar.add(cm);
    }
  } else {
    // Classic cylinder with wooden lid
    const bg = new THREE.CylinderGeometry(r, r*0.94, h, 20, 3);
    perturb(bg, 0.008);
    const glass = new THREE.Mesh(bg, glassMat);
    glass.position.y = h/2;
    jar.add(glass);
    const fillH = h * 0.72;
    const nCandy = Math.floor(r * h * 180);
    for (let i = 0; i < nCandy; i++) {
      const cr = rr(0.028, 0.052);
      const cg = new THREE.SphereGeometry(cr, 7, 5);
      perturb(cg, cr*0.22);
      const cm = new THREE.Mesh(cg, new THREE.MeshStandardMaterial({
        color: pick(candyCols), roughness: rr(0.28, 0.48)
      }));
      const a = rand()*Math.PI*2, rad = Math.sqrt(rand())*r*0.72;
      cm.position.set(Math.cos(a)*rad, rr(cr, fillH), Math.sin(a)*rad);
      jar.add(cm);
    }
    const lg = new THREE.CylinderGeometry(r*1.08, r*1.08, 0.075, 18, 2);
    perturb(lg, 0.01);
    const lid = new THREE.Mesh(lg, woodMid);
    lid.position.y = h + 0.037;
    lid.castShadow = true;
    jar.add(lid);
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.038, 8, 6), woodDark);
    knob.position.y = h + 0.095;
    jar.add(knob);
  }
  
  jar.traverse(o => { if (o.isMesh && o.material !== glassMat) o.castShadow = true; });
  return jar;
}

// === GIANT LOLLIPOPS ===
function makeLollipop(size, colA, colB) {
  const g = new THREE.Group();
  // Stick
  const sg = new THREE.CylinderGeometry(0.022, 0.028, 0.85, 8, 3);
  const sp = sg.attributes.position;
  for (let i = 0; i < sp.count; i++) sp.setX(i, sp.getX(i) + Math.sin(sp.getY(i)*5)*0.015);
  sg.computeVertexNormals();
  const stick = new THREE.Mesh(sg, new THREE.MeshStandardMaterial({ color: 0xe8dcc0, roughness: 0.6 }));
  stick.position.y = 0.42;
  stick.castShadow = true;
  g.add(stick);
  // Swirl disc
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, 256, 256);
  const ca = '#'+colA.toString(16).padStart(6,'0'), cb = '#'+colB.toString(16).padStart(6,'0');
  x.translate(128, 128);
  for (let r = 124; r > 0; r -= 9) {
    x.strokeStyle = (r/9) % 2 < 1 ? ca : cb;
    x.lineWidth = 9;
    x.beginPath();
    for (let a = 0; a <= Math.PI*2.2; a += 0.1) {
      const spiralR = r - (a/(Math.PI*2.2))*9;
      const px = Math.cos(a + r*0.05)*spiralR, py = Math.sin(a + r*0.05)*spiralR;
      a === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
    }
    x.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  const dg = new THREE.CylinderGeometry(size, size, 0.045, 28, 2);
  perturb(dg, 0.006);
  const disc = new THREE.Mesh(dg, new THREE.MeshStandardMaterial({ map: tex, roughness: 0.28 }));
  // Map texture to top face
  const uv = dg.attributes.uv;
  disc.rotation.x = Math.PI/2;
  disc.position.y = 0.92;
  disc.castShadow = true;
  g.add(disc);
  // Plastic wrap shine
  const wrap = new THREE.Mesh(
    new THREE.SphereGeometry(size*1.02, 16, 12, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.12, roughness: 0.05 })
  );
  wrap.position.y = 0.92;
  wrap.rotation.x = Math.PI/2;
  wrap.scale.set(1, 1, 0.35);
  g.add(wrap);
  return g;
}

// === COTTON CANDY ===
function makeCottonCandy(colorHex) {
  const g = new THREE.Group();
  const cone = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.32, 8), new THREE.MeshStandardMaterial({ color: 0xe8d8b8, roughness: 0.8 }));
  cone.position.y = 0.16;
  g.add(cone);
  for (let i = 0; i < 18; i++) {
    const s = new THREE.Mesh(
      new THREE.SphereGeometry(rr(0.055, 0.1), 8, 6),
      new THREE.MeshStandardMaterial({ color: new THREE.Color(colorHex).offsetHSL(0, 0, rr(-0.06, 0.06)), roughness: 1 })
    );
    perturb(s.geometry, 0.018);
    const a = rand()*Math.PI*2, r = rand()*0.1;
    s.position.set(Math.cos(a)*r, 0.4 + rand()*0.17, Math.sin(a)*r);
    s.castShadow = true;
    g.add(s);
  }
  return g;
}
